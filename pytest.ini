[pytest]
testpaths = tests
addopts =
    -v
    --browser=chromium
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=test-results